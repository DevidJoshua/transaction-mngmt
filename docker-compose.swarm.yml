# Prismalink multi-tenant platform — Docker Swarm deployment
#
# Build and tag images first (from repo root):
#   docker build -t plink5-api:latest -f server/Dockerfile server
#   docker build -t plink5-web:latest -f Dockerfile.web .
#
# For multi-node, push to a registry and update the `image:` tags below.
#
# Deploy:
#   docker stack deploy -c docker-compose.swarm.yml plink5
#
# Secrets (create once):
#   printf 'change-me-db-password' | docker secret create postgres_password -
#   printf 'change-me-jwt-secret'   | docker secret create jwt_secret -
#
# Tear down:
#   docker stack rm plink5

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plink
      POSTGRES_DB: plink5
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - plink5_pgdata:/var/lib/postgresql/data
    networks:
      - plink5-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      update_config:
        order: stop-first

  api:
    image: plink5-api:latest
    environment:
      NODE_ENV: production
      DB_HOST: db
      PORT: "4000"
    secrets:
      - postgres_password
      - jwt_secret
    networks:
      - plink5-net
    depends_on:
      - db
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  web:
    image: plink5-web:latest
    ports:
      - "80:80"
    networks:
      - plink5-net
    depends_on:
      - api
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M

networks:
  plink5-net:
    driver: overlay

volumes:
  plink5_pgdata:

secrets:
  postgres_password:
    external: true
  jwt_secret:
    external: true
